<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#192024">
  <meta name="description" content="Járd be a Blenderben készült berendezett szobát belső vagy külső nézetből.">
  <title>3D Szoba · Szobabejárás</title>
  <link rel="stylesheet" href="./style.css?v=10">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="./room.js?v=22"></script>
</head>
<body data-mode="ready">
  <main class="layout">
    <aside class="panel" id="panel" aria-label="Szobabejárás menü" data-i18n-label="menu">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 3 28 9.5v13L16 29 4 22.5v-13L16 3Zm0 13 12-6.5M16 16 4 9.5M16 16v13"
              stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/>
          </svg>
        </span>
        <span data-i18n="brand">Szobabejárás</span>
      </div>

      <div class="intro">
        <h1 data-i18n="title">3D Szoba</h1>
        <p class="room-size" id="room-size">2,90 × 4,10 m</p>
        <p class="intro-copy" id="intro-copy">Járd be a berendezett szobát belső vagy külső nézetből.</p>
        <button class="play" id="play" type="button" disabled>
          <span class="play-icon" aria-hidden="true"></span>
          <span id="play-label">A szoba betöltése…</span>
        </button>
        <p class="load-error" id="load-error" role="status" hidden></p>
        <button class="text-button" id="restart" type="button" data-i18n="restart" hidden>Vissza a bejárathoz</button>
      </div>

      <div class="controls" aria-label="Irányítás" data-i18n-label="controls">
        <p class="desktop-controls" id="desktop-controls">WASD / nyilak · Shift futás · Egér · Esc szünet
Q méretek · V nézet · E fény · M zene · F teljes képernyő
Fal 1–5 · Padló 6–9</p>
        <p class="touch-controls" data-i18n="touchControls">Mozgás a virtuális karral. A körülnézéshez húzd el a képet.</p>
      </div>
    </aside>

    <section class="stage" id="stage" aria-label="Interaktív 3D szoba" data-i18n-label="stage">
      <div class="viewport" id="viewport"></div>
      <div class="stage-top">
        <button class="scene-button" id="pause" type="button" hidden>
          <span class="pause-icon" aria-hidden="true"></span><span data-i18n="pause">Szünet</span>
        </button>
        <div class="stage-tools">
          <button class="scene-button" id="lighting" type="button" aria-pressed="true" aria-keyshortcuts="E" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20.5 15.7a8.8 8.8 0 0 1-12.2-12 9 9 0 1 0 12.2 12Z"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="lighting-label">Nappali fény</span>
          </button>
          <button class="scene-button music-button" id="music" type="button" aria-pressed="true" aria-keyshortcuts="M" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 17V6l11-2v11M9 17a2.5 2.5 0 1 1-2.5-2.5H9Zm11-2a2.5 2.5 0 1 1-2.5-2.5H20Z"/>
              <path class="music-off" d="M4 4l16 16"/>
            </svg>
            <span data-i18n="music">Zene</span>
          </button>
          <div class="language" role="group" aria-label="Nyelv" data-i18n-label="language">
            <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
            <button type="button" data-lang="hu" lang="hu" aria-label="Magyar" aria-pressed="true">HU</button>
          </div>
        </div>
      </div>

      <p class="stage-tip" id="stage-tip" hidden></p>
      <div class="reticle" id="reticle" hidden aria-hidden="true"></div>
      <div class="joystick" id="joystick" hidden aria-hidden="true">
        <span id="joystick-knob"></span>
      </div>
      <div class="mobile-tools" id="mobile-tools" role="group" aria-label="Irányítás" data-i18n-label="controls" hidden>
        <button class="scene-button" id="mobile-camera" type="button" aria-pressed="false"
          aria-label="Külső nézet" data-i18n-label="thirdPersonView">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/>
          </svg>
          <span id="camera-mode">FPS</span>
        </button>
        <button class="scene-button" id="mobile-fullscreen" type="button" aria-pressed="false"
          aria-label="Teljes képernyő" data-i18n-label="fullscreen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path class="fullscreen-in" d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/>
            <path class="fullscreen-out" d="M9 4v5H4m16 0h-5V4m0 16v-5h5m-16 0h5v5"/>
          </svg>
        </button>
        <button class="scene-button" id="mobile-wall" type="button">
          <span data-i18n="wall">Fal</span><span class="preset-number" id="wall-preset">4</span>
        </button>
        <button class="scene-button" id="mobile-floor" type="button">
          <span data-i18n="floor">Padló</span><span class="preset-number" id="floor-preset">9</span>
        </button>
      </div>
    </section>
  </main>
  <noscript>A 3D szoba bejárásához engedélyezd a JavaScriptet.</noscript>
</body>
</html>
